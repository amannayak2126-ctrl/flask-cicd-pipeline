name: Flask CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: |
          python -m pytest

      # 5. Define Docker image tags
      - name: Define Docker image tags
        run: |
          echo "IMAGE_NAME=amannayak2126/flask-cicd-pipeline" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 6. Build versioned Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:latest" \
            .

      # 7. Log in to Docker Hub
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u amannayak2126 \
            --password-stdin

      # 8. Push versioned Docker image
      - name: Push versioned Docker image
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      # 9. Push latest Docker image
      - name: Push latest Docker image
        run: |
          docker push "$IMAGE_NAME:latest"

      # 10. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: 697292529243

      # 11. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 12. Deploy exact version to EC2 using SSM
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask CI/CD version ${GITHUB_SHA::7}" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "docker pull amannayak2126/flask-cicd-pipeline:'"${GITHUB_SHA::7}"'",
              "docker stop flask-cicd-container || true",
              "docker rm flask-cicd-container || true",
              "docker run -d --name flask-cicd-container -p 5000:5000 --restart unless-stopped amannayak2126/flask-cicd-pipeline:'"${GITHUB_SHA::7}"'",
              "sleep 5",
              "docker exec flask-cicd-container python -c \"import urllib.request; r=urllib.request.urlopen('\''http://127.0.0.1:5000/health'\''); assert r.status == 200; print(r.read().decode())\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment and health check..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment and health check successful!"

                echo "----- DEPLOYMENT OUTPUT -----"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                echo "Deployment or health check failed!"

                echo "----- STDOUT -----"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                echo "----- STDERR -----"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              Pending|InProgress|Delayed|"")
                sleep 5
                ;;

              *)
                echo "Unknown status: $STATUS"
                sleep 5
                ;;

            esac

          done

          echo "Deployment timed out waiting for SSM."
          exit 1
