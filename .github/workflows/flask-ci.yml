name: Flask CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build \
            -t amannayak2126/flask-cicd-pipeline:latest .

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u amannayak2126 \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push \
            amannayak2126/flask-cicd-pipeline:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          allowed-account-ids: 697292529243

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flask CI/CD application" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "docker pull amannayak2126/flask-cicd-pipeline:latest",
              "docker stop flask-cicd-container || true",
              "docker rm flask-cicd-container || true",
              "docker run -d --name flask-cicd-container -p 5000:5000 --restart unless-stopped amannayak2126/flask-cicd-pipeline:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful!"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                echo "Deployment failed!"

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text

                exit 1
                ;;

              Pending|InProgress|Delayed|"")
                sleep 5
                ;;

              *)
                echo "Unknown status: $STATUS"
                sleep 5
                ;;
            esac
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
