name: Flask CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t amannayak2126/flask-cicd-pipeline:latest .

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u amannayak2126 \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push amannayak2126/flask-cicd-pipeline:latest

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" << 'EOF'

            docker pull amannayak2126/flask-cicd-pipeline:latest

            docker stop flask-cicd-container || true
            docker rm flask-cicd-container || true

            docker run -d \
              --name flask-cicd-container \
              -p 5000:5000 \
              --restart unless-stopped \
              amannayak2126/flask-cicd-pipeline:latest
          EOF
